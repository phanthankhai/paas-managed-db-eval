# Kien truc IaaS tu quan ly (Self-Managed Equivalent Stack)
# Khi trien khai tren IaaS (EC2 / DigitalOcean Droplet / VPS), ky su phai tu van hanh:
# 1. Reverse Proxy (Nginx) & SSL
# 2. Tu quan ly Database (Postgres container + persistent volume + backup)
# 3. Application container + Restart policies + Network isolation

version: '3.8'

services:
  # 1. Nginx Reverse Proxy & SSL Termination
  reverse-proxy:
    image: nginx:alpine
    container_name: iaas_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-app
    networks:
      - app-network

  # 2. Web Application Process
  web-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: iaas_node_app
    restart: always
    command: sh -c "npx prisma migrate deploy && node src/server.js"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://db_user:secure_password_123@iaas_postgres:5432/app_db?schema=public
    depends_on:
      iaas_postgres:
        condition: service_healthy
    networks:
      - app-network

  # 3. Self-Managed PostgreSQL (Nguoi quan tri phai tu lo backup, disk space, tuning)
  iaas_postgres:
    image: postgres:15-alpine
    container_name: iaas_postgres_db
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  pgdata:
    driver: local

networks:
  app-network:
    driver: bridge

