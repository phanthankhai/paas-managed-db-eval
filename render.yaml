# Render Infrastructure-as-Code Blueprint
# Khai bao Web Service PaaS va Managed PostgreSQL Database tach biet

services:
  # 1. PaaS Web Service (Stateless Node.js Application)
  - type: web
    name: paas-managed-db-eval-app
    runtime: node
    plan: free
    region: singapore # Hoac oregon / frankfurt
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /readyz # Platform routing dung path nay de kiem tra rolling update
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: paas-managed-postgres
          property: connectionString

databases:
  # 2. Managed Database (Stateful Backing Service - Tach biet hoan toan)
  - name: paas-managed-postgres
    plan: free
    region: singapore
    databaseName: paas_db
    user: paas_user
